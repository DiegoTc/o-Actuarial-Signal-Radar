services:
  app:
    build: .
    working_dir: /app
    command: ["python", "scripts/serve_dashboard_api.py"]
    volumes:
      - .:/app
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      INVESTIGATION_PROVIDER: ${INVESTIGATION_PROVIDER:-mock}
      INVESTIGATION_LANGUAGE: ${INVESTIGATION_LANGUAGE:-en}
      INVESTIGATION_TIMEOUT_SECONDS: ${INVESTIGATION_TIMEOUT_SECONDS:-60}
      INVESTIGATION_MAX_TOKENS: ${INVESTIGATION_MAX_TOKENS:-2500}
      AMD_VLLM_BASE_URL: ${AMD_VLLM_BASE_URL:-}
      AMD_VLLM_MODEL: ${AMD_VLLM_MODEL:-}
      AMD_VLLM_API_KEY: ${AMD_VLLM_API_KEY:-}
      AMD_TOKEN_FACTORY_BASE_URL: ${AMD_TOKEN_FACTORY_BASE_URL:-}
      AMD_TOKEN_FACTORY_MODEL: ${AMD_TOKEN_FACTORY_MODEL:-}
      AMD_TOKEN_FACTORY_API_KEY: ${AMD_TOKEN_FACTORY_API_KEY:-}
      EVOLUS_BASE_URL: ${EVOLUS_BASE_URL:-${EVOLUS_API_URL:-https://api.evolus.ai/api/v1}}
      EVOLUS_APPLICATION_ID: ${EVOLUS_APPLICATION_ID:-${EVOLUS_WORKSPACE_ID:-}}
      EVOLUS_API_KEY: ${EVOLUS_API_KEY:-}
      EVOLUS_WORKFLOW_ID: ${EVOLUS_WORKFLOW_ID:-}
      EVOLUS_LIBRARY_ID: ${EVOLUS_LIBRARY_ID:-}
      EVOLUS_RESULT_POINTER: ${EVOLUS_RESULT_POINTER:-}
      EVOLUS_POLL_INTERVAL_SECONDS: ${EVOLUS_POLL_INTERVAL_SECONDS:-2}
      EVOLUS_MAXIMUM_POLLS: ${EVOLUS_MAXIMUM_POLLS:-30}

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DASHBOARD_API_URL: http://app:8001
    depends_on:
      - app
